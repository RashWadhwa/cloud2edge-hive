services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto_data:/mosquitto/data

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt
    container_name: zigbee2mqtt
    restart: unless-stopped
    volumes:
      - ./zigbee2mqtt_data:/app/data
      - /run/udev:/run/udev:ro
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/London
    devices:
      - /dev/serial/by-id/usb-SONOFF_SONOFF_Dongle_Plus_MG24_485c3961e1a2ef11b0be8e6661ce3355-if00-port0 -> ../../ttyUSB0
      - mosquitto

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - ./ha_config:/config
    depends_on:
      - mosquitto

  influxdb:
    image: influxdb:2.7
    container_name: influx
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - ./influx_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=hive
      - DOCKER_INFLUXDB_INIT_PASSWORD=HiveEdge1234
      - DOCKER_INFLUXDB_INIT_ORG=hive-edge
      - DOCKER_INFLUXDB_INIT_BUCKET=hive
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=hive-edge-token-123

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana

