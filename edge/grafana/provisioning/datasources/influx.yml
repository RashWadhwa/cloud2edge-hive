apiVersion: 1
datasources:
  - name: EdgeClimate
    uid: edge-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: edgeclimate
      defaultBucket: environment
    secureJsonData:
      token: ${INFLUX_READ_TOKEN}
